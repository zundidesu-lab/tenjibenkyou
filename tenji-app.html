<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>点字マナビ — Japanese Braille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-dark:#F2F2F2;
    --ink:#22304A;
    --ink-soft:#5B6B85;
    --indigo:#2B4570;
    --indigo-deep:#1B2C46;
    --shu:#C1440E;
    --shu-soft:#F5E1D8;
    --ao:#3468A6;
    --ao-soft:#E4EDF6;
    --gold:#C9A227;
    --green:#3E9C5C;
    --green-soft:#E4F5E9;
    --purple:#7A4FBE;
    --purple-soft:#EDE5F8;
    --card:#FFFFFF;
    --line:#E9E9E9;
    --radius:18px;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161B26; --paper-dark:#10141C; --ink:#EDEFF5; --ink-soft:#9AA5BD;
      --card:#1E2432; --line:#2B3245; --shu-soft:#3A2620; --ao-soft:#1E2C40; --green-soft:#173626; --purple-soft:#241C33;
    }
  }
  :root[data-theme="dark"]{
    --paper:#161B26; --paper-dark:#10141C; --ink:#EDEFF5; --ink-soft:#9AA5BD;
    --card:#1E2432; --line:#2B3245; --shu-soft:#3A2620; --ao-soft:#1E2C40; --green-soft:#173626; --purple-soft:#241C33;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  .kana{font-family:'Zen Maru Gothic',sans-serif;}
  #app{max-width:480px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--paper);
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
    display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--line);
  }
  .topbar .stat{display:flex; align-items:center; gap:5px; font-weight:800; font-size:14px;}
  .topbar .tagline{font-size:12.5px; font-weight:800; color:var(--ink-soft); line-height:1.35;}
  .confirm-sheet{background:var(--paper); border-radius:20px; padding:22px 20px 18px; max-width:320px; width:100%; text-align:center;}
  .confirm-sheet p{margin:0 0 18px; font-size:14.5px; font-weight:700; line-height:1.6;}
  .confirm-btns{display:flex; gap:10px;}
  .topbar .spacer{flex:1;}
  .admin-toggle{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:5px 8px;border-radius:999px;cursor:pointer;user-select:none;}
  .admin-toggle .dot{width:9px;height:9px;border-radius:50%;background:#c8c8c8;}
  .admin-toggle.on{color:var(--shu);border-color:var(--shu);}
  .admin-toggle.on .dot{background:var(--shu);}

  /* ---------- screens ---------- */
  .screen{flex:1; display:flex; flex-direction:column; padding-bottom:40px;}
  .hidden{display:none !important;}

  /* ---------- path / home ---------- */
  .path-wrap{padding:24px 16px 60px; display:flex; flex-direction:column; align-items:center; gap:0;}
  .chapter-block{width:100%; max-width:380px; margin-bottom:6px;}
  .chapter-head{margin:34px 0 22px;}
  .chapter-rule{height:3px; border-radius:3px; background:var(--ao); margin-bottom:10px;}
  .chapter-head .row{display:flex; align-items:flex-end; justify-content:space-between; gap:10px;}
  .chapter-head .num{font-size:10.5px; font-weight:800; letter-spacing:.16em; color:var(--ao); text-transform:uppercase;}
  .chapter-head .name{font-size:17.5px; font-weight:800; margin-top:4px; color:var(--ink);}
  .chapter-head .name .kana{font-size:19px;}
  .chapter-head .ch-state{font-size:15px; opacity:.55;}
  .chapter-block.todo .chapter-rule{background:var(--line);}
  .chapter-block.todo .num,
  .chapter-block.todo .name{color:var(--ink-soft);}
  .chapter-block.locked-ch{filter:grayscale(1); opacity:.42;}
  .exam-row.locked-ex{filter:grayscale(1); opacity:.45;}

  /* ---------- braille chart card ---------- */
  .chart-card{width:100%; max-width:380px; display:flex; align-items:center; gap:13px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:12px 14px; cursor:pointer; margin:0 0 6px;}
  .chart-card:active{background:var(--paper-dark);}
  .chart-card .mini{display:grid; grid-template-columns:repeat(2,8px); grid-template-rows:repeat(3,8px); gap:3px;}
  .chart-card .mini i{display:block; border-radius:50%; background:var(--line);}
  .chart-card .mini i.on{background:var(--ink);}
  .chart-card .cc-title{font-size:13.5px; font-weight:800;}
  .chart-card .cc-sub{font-size:11px; color:var(--ink-soft); font-weight:700; margin-top:1px;}
  .chart-card .cc-go{margin-left:auto; color:var(--ink-soft); font-size:18px;}

  .chart-legend{display:flex; gap:16px; font-size:11px; color:var(--ink-soft); font-weight:700; margin-bottom:14px;}
  .chart-legend span{display:flex; align-items:center; gap:6px;}
  .chart-legend b{width:10px; height:10px; border-radius:50%; background:var(--ink); display:block;}
  .chart-legend b.faded{opacity:.3;}
  .chart-group{margin-bottom:18px;}
  .chart-group h4{margin:0 0 9px; font-size:11.5px; font-weight:800; color:var(--ink-soft); letter-spacing:.1em;
    display:flex; align-items:center; gap:9px;}
  .chart-group h4:after{content:''; flex:1; height:1px; background:var(--line);}
  .chart-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr)); gap:6px;}
  .chart-cell{display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 2px;
    border-radius:11px; background:var(--card); border:1px solid var(--line);}
  .chart-cell.dim{opacity:.3;}
  .chart-cell .cell{grid-template-columns:repeat(2,9px); grid-template-rows:repeat(3,9px); gap:3px; padding:2px;}
  .chart-cell .dotcell{border-width:1.5px;}
  .chart-cell .k{font-size:16px; font-weight:700; margin-top:2px;}
  .chart-cell .r{font-size:9.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase;}
  .node-row{display:flex; justify-content:center; gap:34px; margin-bottom:30px;}
  .node{
    width:78px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;
  }
  .node-circle{
    width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:26px; position:relative; background:var(--card);
    border:5px solid var(--line); box-shadow:0 4px 0 rgba(0,0,0,.08);
  }
  .node-circle:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.08);}
  .node.locked .node-circle{border-color:var(--line); background:var(--paper-dark); cursor:not-allowed; opacity:.7;}
  .node.locked{cursor:not-allowed;}
  .node.wajib .node-circle{border-color:var(--green);}
  .node.wajib.done .node-circle{background:var(--green); border-color:var(--green); color:#fff;}
  .node.latihan .node-circle{border-color:var(--gold);}
  .node.latihan.done .node-circle{background:var(--gold); border-color:var(--gold); color:#fff;}
  .node-label{font-size:11.5px; font-weight:700; color:var(--ink-soft); text-align:center; line-height:1.2;}
  .node-star{position:absolute; bottom:-6px; right:-6px; background:var(--gold); color:#fff; border-radius:999px; min-width:22px; height:22px; padding:0 5px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; box-shadow:0 1px 3px rgba(0,0,0,.25);}

  .exam-row{display:flex; justify-content:center; margin:6px 0 34px;}
  .exam-node{display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; width:120px;}
  .exam-circle{
    width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:34px; position:relative; background:var(--card); border:6px solid var(--purple);
    box-shadow:0 4px 0 rgba(0,0,0,.08);
  }
  .exam-circle:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.08);}
  .exam-node.done .exam-circle{background:var(--purple); border-color:var(--purple); color:#fff;}
  .exam-node.locked .exam-circle{border-color:var(--line); background:var(--paper-dark); opacity:.7; cursor:not-allowed;}
  .exam-node.locked{cursor:not-allowed;}
  .exam-label{font-size:12.5px; font-weight:800; text-align:center; color:var(--purple);}
  .exam-node.locked .exam-label{color:var(--ink-soft);}
  .exam-sub{font-size:10.5px; font-weight:600; color:var(--ink-soft); text-align:center;}

  .basic-row{display:flex; justify-content:center; margin:4px 0 30px;}
  .basic-node{display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; width:150px;}
  .basic-circle{
    width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:34px; background:var(--card); border:6px solid var(--ao); box-shadow:0 4px 0 rgba(0,0,0,.08);
  }
  .basic-circle:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.08);}
  .basic-node.done .basic-circle{background:var(--ao); border-color:var(--ao); color:#fff;}
  .basic-label{font-size:12.5px; font-weight:800; text-align:center; color:var(--ao);}
  .basic-sub{font-size:10.5px; font-weight:600; color:var(--ink-soft); text-align:center;}

  /* ---------- basics lesson ---------- */
  .lesson-wrap{flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; padding:26px 22px 20px;}
  .lesson-dots{display:flex; gap:6px; margin-bottom:26px;}
  .lesson-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block;}
  .lesson-dots i.on{background:var(--ao); width:22px; border-radius:999px;}
  .lesson-visual{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:24px; min-height:120px;}
  .lesson-item{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .lesson-cap{font-size:11.5px; font-weight:700; color:var(--ink-soft);}
  .lesson-op{font-size:26px; font-weight:800; color:var(--ink-soft);}
  .lesson-wrap h2{font-size:21px; margin:0 0 12px; font-weight:800;}
  .lesson-wrap p{font-size:14.5px; line-height:1.7; color:var(--ink-soft); margin:0 0 10px; max-width:330px;}
  .lesson-wrap .big-emoji{font-size:64px; margin-bottom:10px;}
  .lesson-cta{width:100%; max-width:330px; margin-top:auto; padding-top:20px;}

  .intro-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin:6px 16px 0; }
  .intro-card h1{font-size:20px; margin:0 0 6px; font-weight:800;}
  .intro-card p{font-size:14px; color:var(--ink-soft); line-height:1.55; margin:0 0 10px;}
  .legend{display:flex; gap:14px; font-size:12.5px; font-weight:700; margin-top:8px; flex-wrap:wrap;}
  .legend span{display:flex; align-items:center; gap:6px;}
  .legend i{width:12px;height:12px;border-radius:50%; display:inline-block;}

  .mode-select{display:flex; gap:8px; margin-top:14px;}
  .mode-btn{flex:1; border:2px solid var(--line); background:var(--card); border-radius:14px; padding:12px 8px; text-align:center; cursor:pointer;}
  .mode-btn .mb-emoji{font-size:22px;}
  .mode-btn .mb-label{font-size:12.5px; font-weight:800; margin-top:4px;}
  .mode-btn .mb-sub{font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
  .mode-btn.active{border-color:var(--indigo); background:var(--ao-soft);}

  .special-badge{display:inline-flex; align-items:center; gap:4px; background:var(--gold); color:#fff; font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:999px; margin-left:6px;}
  .note-box{background:var(--ao-soft); border:1px solid var(--ao); border-radius:14px; padding:12px 14px; font-size:12.5px; color:var(--ink); line-height:1.5; margin:0 16px 12px;}
  .note-box b{color:var(--indigo);}

  /* ---------- generic screen header ---------- */
  .screen-head{display:flex; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); z-index:10;}
  .back-btn{width:34px;height:34px;border-radius:50%; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--ink);}
  .screen-title{font-weight:800; font-size:15.5px;}
  .screen-sub{font-size:12px; color:var(--ink-soft); font-weight:600;}
  .progress-bar{flex:1;height:12px;background:var(--paper-dark);border-radius:999px;overflow:hidden;margin:0 4px;}
  .progress-bar > div{height:100%;background:var(--green);border-radius:999px;transition:width .3s;}
  .hearts{display:flex;gap:3px;font-size:16px;}

  /* ---------- braille cell ---------- */
  .cell{display:inline-grid; grid-template-columns:repeat(2, 22px); grid-template-rows:repeat(3, 22px); gap:6px; padding:8px;}
  .cell.big{grid-template-columns:repeat(2, 30px); grid-template-rows:repeat(3, 30px); gap:8px; padding:10px;}
  .dotcell{width:100%;height:100%;border-radius:50%; background:var(--paper-dark); border:2px solid var(--line);}
  .dotcell.on-vowel{background:var(--ao); border-color:var(--ao);}
  .dotcell.on-consonant{background:var(--shu); border-color:var(--shu);}
  .dotcell.on-black{background:var(--ink); border-color:var(--ink);}
  .cell-inline{display:inline-flex;}
  .cell.numbered .dotcell{display:flex; align-items:center; justify-content:center;}
  .cell.numbered .dotcell span{font-size:14px; font-weight:800; color:var(--ink-soft); opacity:0;
    transform:scale(.3); animation:dotPop .5s cubic-bezier(.2,1.5,.4,1) forwards;}
  @keyframes dotPop{to{opacity:1; transform:scale(1);}}

  /* ---------- material step (wajib) ---------- */
  .mat-step{flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; padding:22px 22px 0;}
  .mat-step .step-kana{font-size:62px; font-weight:700; line-height:1.05; margin-top:14px;}
  .mat-step .step-romaji{font-size:14px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.1em;}
  .dot-breakdown{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:18px;}
  .db-item{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .db-item i{width:11px; height:11px; border-radius:50%; display:block;}

  /* ---------- material list (wajib) ---------- */
  .material-list{padding:14px 16px; display:flex; flex-direction:column; gap:10px;}
  .mat-row{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:14px;}
  .mat-kana{font-size:30px; font-weight:700; width:44px; text-align:center;}
  .mat-info{flex:1;}
  .mat-romaji{font-size:13px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .mat-desc{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .cta-row{padding:16px; position:sticky; bottom:0; background:linear-gradient(to top, var(--paper) 60%, transparent); }
  .btn{
    display:block; width:100%; text-align:center; padding:15px; border-radius:16px; border:none;
    font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.15);
  }
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15);}
  .btn-primary{background:var(--green); color:#fff;}
  .btn-secondary{background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:none;}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .link-btn{background:none;border:none;color:var(--ao);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;}

  /* ---------- quiz ---------- */
  .quiz-wrap{flex:1; display:flex; flex-direction:column; padding:22px 18px;}
  .quiz-prompt{font-size:14px; font-weight:700; color:var(--ink-soft); margin-bottom:14px; text-align:center;}
  .quiz-focus{display:flex; justify-content:center; margin-bottom:22px;}
  .quiz-focus .big-kana{font-size:56px; font-weight:700;}
  .braille-seq{display:flex; gap:4px; justify-content:center; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 16px;}
  .options{display:flex; flex-direction:column; gap:10px; margin-top:auto;}
  .opt-btn{
    background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px; text-align:left;
    font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:12px;
  }
  .opt-btn .cell{padding:4px;}
  .opt-btn:active{background:var(--paper-dark);}
  .opt-btn.correct{border-color:var(--green); background:var(--green-soft);}
  .opt-btn.wrong{border-color:var(--shu); background:var(--shu-soft);}
  .opt-sub{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .opt-main{display:flex; flex-direction:column; gap:1px; align-items:flex-start;}
  .opt-kana{font-size:21px; font-weight:700; line-height:1.2;}
  .opt-romaji{font-size:11.5px; font-weight:700; color:var(--ink-soft); letter-spacing:.05em;}
  .opt-mean{font-size:11px; font-weight:600; font-style:italic; color:var(--ink-soft); margin-top:3px;}
  .opt-mean.hide{display:none;}
  .feedback-bar{position:sticky; bottom:0; padding:16px; margin:16px -18px -22px; }
  .feedback-bar.ok{background:var(--green-soft);}
  .feedback-bar.bad{background:var(--shu-soft);}
  .feedback-bar .fb-title{font-weight:800; font-size:15px; margin-bottom:10px;}
  .feedback-bar.ok .fb-title{color:var(--green);}
  .feedback-bar.bad .fb-title{color:var(--shu);}

  /* ---------- table modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(20,20,20,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal-overlay.center{align-items:center; padding:20px;}
  .modal-sheet{background:var(--paper); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:18px; max-height:78vh; overflow-y:auto;}
  .modal-overlay.center .modal-sheet{border-radius:20px; max-height:80vh;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .modal-head h3{margin:0; font-size:16px; font-weight:800;}
  .close-x{width:30px;height:30px;border-radius:50%;border:none;background:var(--paper-dark);font-size:15px;cursor:pointer;}
  .table-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(72px,1fr)); gap:8px;}
  .table-cell{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .table-cell .kana{font-size:19px; font-weight:700;}
  .table-cell .romaji{font-size:10px; color:var(--ink-soft); font-weight:700; text-transform:uppercase;}

  .center-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px;}
  .center-screen .emoji{font-size:64px; margin-bottom:14px;}
  .center-screen h2{font-size:22px; margin:0 0 8px;}
  .center-screen p{color:var(--ink-soft); font-size:14px; margin:0 0 22px; max-width:300px;}
  .result-stats{display:flex; gap:24px; margin-bottom:24px;}
  .result-stat{text-align:center;}
  .result-stat .n{font-size:26px; font-weight:900;}
  .result-stat .l{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   DATA: Japanese braille (gojūon) dot patterns, verified.
   Dot positions: 1,2,3 = left column top to bottom, 4,5,6 = right column.
   Colour rule (required level): dots {1,2,4} = blue (vowel base),
   dots {3,5,6} = red (consonant marker).
   ============================================================ */
const CHAPTERS = [
  { id:1, kana:'あ行', romajiName:'A-gyō',
    desc:{en:'The five basic vowels. Every other character is built on these.', jp:'基本の母音５つ。すべての文字の土台です。'},
    special:true,
    note:{en:'The shapes for あ, い and う look like the braille numbers 1, 2 and 3, but the resemblance stops there: え and お do not follow the number order.', jp:'あ・い・うの形は数字の１・２・３に似ていますが、似ているのはここまでです。え・おは数字の順とは違います。'},
    chars:[
      {k:'あ',r:'a',d:[1]},
      {k:'い',r:'i',d:[1,2]},
      {k:'う',r:'u',d:[1,4]},
      {k:'え',r:'e',d:[1,2,4]},
      {k:'お',r:'o',d:[2,4]},
    ]},
  { id:2, kana:'か行', romajiName:'Ka-gyō',

/* ============================================================
   STATE
   ============================================================ */
const STORAGE_KEY = 'tenji_manabi_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { admin:true, basics:false, progress:{}, mode:'asing', examProgress:{} };
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
let state = loadState();
if(!state.mode) state.mode = 'asing';
if(!state.examProgress) state.examProgress = {};
if(typeof state.basics !== 'boolean') state.basics = false;
function isJP(){ return state.mode === 'jepang'; }
function L(){ return isJP() ? 'jp' : 'en'; }
function T(en, jp){ return isJP() ? jp : en; }
function LX(o){ return o ? (o[L()] || '') : ''; }
function chProg(id){
  if(!state.progress[id]) state.progress[id] = {wajib:false, latihanBest:0};
  return state.progress[id];
}

// router
let route = {screen:'home'};
const app = document.getElementById('app');

function isUnlocked(chapterId){
  if(state.admin) return true;
  return prevGateDone(chapterId);
}
function prevGateDone(chapterId){
  if(chapterId===1) return !!state.basics;
  const examBefore = EXAMS.find(e=>e.afterChapter===chapterId-1);
  if(examBefore) return isExamPassed(examBefore.id);
  return !!chProg(chapterId-1).wajib;
}
function isExamPassed(examId){ return !!(state.examProgress[examId] && state.examProgress[examId].passed); }
function isExamUnlocked(exam){
  if(state.admin) return true;
  return !!chProg(exam.afterChapter).wajib;
}

function openBasics(idx){
  const step = BASICS[idx];
  const last = idx === BASICS.length - 1;
  if(last && !state.basics){ state.basics = true; saveState(); }

  let visual = '';
  if(step.emoji){ visual += `<div class="big-emoji">${step.emoji}</div>`; }
  if(step.numbered){
    const order = [1,4,2,5,3,6];
    visual += `<div class="lesson-item"><div class="cell big numbered">` +
      order.map(pos=>`<div class="dotcell"><span style="animation-delay:${(pos-1)*0.42+0.25}s">${pos}</span></div>`).join('') +
      `</div></div>`;
  }
  step.visual.forEach(v=>{
    if(v.op){ visual += `<div class="lesson-op">${v.op}</div>`; return; }
    visual += `<div class="lesson-item">${cellHTML(v.d,'colored','big')}${v.cap?`<div class="lesson-cap kana">${LX(v.cap)}</div>`:''}</div>`;
  });

  app.innerHTML = `
    <div class="screen-head">
      <button class="back-btn" id="backBtn">←</button>
      <div>
        <div class="screen-title">${T('Basics','きほん')}</div>
        <div class="screen-sub">${T('How a braille cell works','点字の仕組み')}</div>
      </div>
    </div>
    <div class="screen lesson-wrap">
      <div class="lesson-dots">${BASICS.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</div>
      <div class="lesson-visual">${visual}</div>
      <h2 class="${isJP()?'kana':''}">${LX(step.title)}</h2>
      <p class="${isJP()?'kana':''}">${LX(step.body)}</p>
      <div class="lesson-cta">
        <button class="btn ${last?'btn-primary':''}" id="nextBtn" style="${last?'':'background:var(--ao);color:#fff;'}">${last? T('Back to map','マップに戻る') : T('Next','次へ')}</button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').onclick = renderHome;
  document.getElementById('nextBtn').onclick = last ? renderHome : ()=>openBasics(idx+1);
}

      if(!isExamUnlocked(exam)) { shake(node); return; }
      startExam(exam);
    };
  });
}
function shake(el){
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}], {duration:280});
}

/* ============================================================
   BRAILLE CELL RENDERER
   ============================================================ */
function cellHTML(dots, mode, size){ // mode: 'colored' | 'black'
  // grid order visually: col1 top-bottom (1,2,3), col2 top-bottom (4,5,6)
  const order = [1,4,2,5,3,6];
  const cls = size==='big'?'cell big':'cell';
  let html = `<div class="${cls}">`;
  order.forEach(pos=>{
    const active = dots.includes(pos);
    let c = 'dotcell';
    if(active){
      if(mode==='black') c+=' on-black';
      else c += (pos===1||pos===2||pos===4) ? ' on-vowel' : ' on-consonant';
    }
    html += `<div class="${c}"></div>`;
  });
  html += `</div>`;
  return html;
}

/* ============================================================
   WAJIB: INTRO / MATERI
   ============================================================ */
function dotBreakdown(ch, c){
  // ya-gyo and wa-gyo are built by shifting the vowel shape, so the
  // plain vowel/consonant split would be misleading there.
  if(c && (c.id===8 || c.id===10)){
    const txt = c.id===8
      ? T('shifted vowel shape + dot 4','ずらした母音の形＋４の点')
      : T('shifted vowel shape, no consonant dot','ずらした母音の形だけ、子音の点なし');
    return `<div class="dot-breakdown"><div class="db-item ${isJP()?'kana':''}"><i style="background:var(--gold)"></i>${txt}</div></div>`;
  }
  const vd = ch.d.filter(d=>[1,2,4].includes(d));
  const cd = ch.d.filter(d=>[3,5,6].includes(d));
  const none = T('none','なし');
  return `<div class="dot-breakdown">
    <div class="db-item"><i style="background:var(--ao)"></i>${T('vowel','母音')}: ${vd.length? vd.join(', ') : none}</div>
    <div class="db-item"><i style="background:var(--shu)"></i>${T('consonant','子音')}: ${cd.length? cd.join(', ') : none}</div>
  </div>`;
}

/* ============================================================
   WAJIB QUIZ
   ============================================================ */
function buildDistractors(pool, correct, n, keyFn){
  const others = pool.filter(x=>keyFn(x)!==keyFn(correct));
  shuffleArr(others);
  return others.slice(0,n);
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startWajibQuiz(chId){
  const c = CHAPTERS.find(x=>x.id===chId);
  const cumulativePool = CHAPTERS.filter(x=>x.id<=chId).flatMap(x=>x.chars); // wider distractor pool; the questions themselves stay within this chapter
  const questions = [];
  const chars = shuffleArr([...c.chars]);
  chars.forEach(ch=>{
    const type = Math.random()<0.5 ? 'read' : 'match';
    questions.push({type, ch});
  });
  // duplikasi ringan biar minimal 6 soal
  while(questions.length < 6){
    const ch = c.chars[Math.floor(Math.random()*c.chars.length)];
    questions.push({type: Math.random()<0.5?'read':'match', ch});
  }
  runWajibQuestion(chId, questions, 0, 0, cumulativePool, c);
}

function runWajibQuestion(chId, questions, idx, correctCount, pool, c){
  if(idx >= questions.length){ return wajibResult(chId, correctCount, questions.length); }
  const q = questions[idx];
  const progressPct = Math.round((idx/questions.length)*100);
  let bodyHtml = '';
  let optionsHtml = '';
  const distract = buildDistractors(c.chars, q.ch, 3, x=>x.k);
  const opts = shuffleArr([q.ch, ...distract]);

  if(q.type==='read'){
    bodyHtml = `<div class="quiz-prompt">${T('What does this braille say?','この点字は何と読みますか。')}</div>
      <div class="quiz-focus"><div class="braille-seq">${cellHTML(q.ch.d,'colored','big')}</div></div>`;
    opts.forEach(o=>{
      const label = `<span class="opt-main"><span class="opt-kana kana">${o.k}</span>${isJP()?'':`<span class="opt-romaji">${o.r}</span>`}</span>`;
      optionsHtml += `<button class="opt-btn" data-correct="${o.k===q.ch.k}">${label}</button>`;
    });
  } else {
    bodyHtml = `<div class="quiz-prompt">${T('Choose the correct dot pattern for:','正しい点の形を選んでください。')}</div>
      <div class="quiz-focus"><div class="big-kana kana">${q.ch.k}</div></div>`;
    opts.forEach(o=>{
      optionsHtml += `<button class="opt-btn" data-correct="${o.k===q.ch.k}">${cellHTML(o.d,'colored')}</button>`;
    });
  }

  app.innerHTML = `
    <div class="screen-head">
      <button class="back-btn" id="quitBtn">✕</button>
      <div class="progress-bar"><div style="width:${progressPct}%"></div></div>
      <div style="font-size:12px;font-weight:800;color:var(--ink-soft)">${idx+1}/${questions.length}</div>
    </div>
    <div class="screen quiz-wrap">
      ${bodyHtml}
      <div class="options">${optionsHtml}</div>
      <button class="link-btn" style="margin-top:14px;" id="tableBtnFree">📖 ${T('Open the chart (free)','一覧表を見る（自由）')}</button>
    </div>
  `;
  document.getElementById('quitBtn').onclick = ()=> askConfirm(T('Leave the quiz? Your progress in this chapter will be lost.','クイズをやめますか。この章の記録は消えます。'), renderHome);
  document.getElementById('tableBtnFree').onclick = ()=>showTableModal(c.chars, 'colored');
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      const ok = btn.dataset.correct==='true';
      btn.classList.add(ok?'correct':'wrong');
      if(!ok){
        document.querySelectorAll('.opt-btn').forEach(b=>{ if(b.dataset.correct==='true') b.classList.add('correct'); });
      }
      const fb = document.createElement('div');
      fb.className = 'feedback-bar ' + (ok?'ok':'bad');
      const answerLabel = isJP() ? `<b class="kana">${q.ch.k}</b>` : `<b>${q.ch.r} (${q.ch.k})</b>`;
      fb.innerHTML = `<div class="fb-title">${ok? T('✓ Correct!','✓ 正解！') : T('✕ Not quite','✕ 残念')}</div>
        ${ok?'':`<div style="font-size:13px;margin-bottom:10px;">${T('Correct answer:','正解：')} ${answerLabel}</div>`}
        <button class="btn ${ok?'btn-primary':'btn-secondary'}" id="nextBtn">${T('Continue','次へ')}</button>`;
      document.querySelector('.quiz-wrap').appendChild(fb);
      fb.scrollIntoView({behavior:'smooth', block:'end'});
      document.getElementById('nextBtn').onclick = ()=> runWajibQuestion(chId, questions, idx+1, correctCount+(ok?1:0), pool, c);
    };
  });
}

function wajibResult(chId, correct, total){
  const pass = correct/total >= 0.6;
  if(pass){ chProg(chId).wajib = true; saveState(); }
  app.innerHTML = `
    <div class="screen center-screen">

      <div class="result-stats">

  document.getElementById('doneBtn').onclick = pass ? renderHome : ()=>openWajibIntro(chId);
}

function startLatihan(chId){
  const pool = [];
  for(let i=1;i<=chId;i++){ if(WORDS[i]) pool.push(...WORDS[i]); }
  const questions = shuffleArr([...pool]);
  while(questions.length < 8){ questions.push(pool[Math.floor(Math.random()*pool.length)]); }
  runLatihanQuestion(chId, questions.slice(0,8), 0, 5, 0, pool);
}

function learnedCharsUpTo(chId){
  const list = [];
  for(let i=1;i<=chId;i++){ const c = CHAPTERS.find(x=>x.id===i); if(c) list.push(...c.chars); }
  return list;
}

function runLatihanQuestion(chId, questions, idx, hearts, correctCount, pool){
  if(hearts<=0){ return latihanResult(chId, correctCount, idx, false); }
  if(idx >= questions.length){ return latihanResult(chId, correctCount, questions.length, true); }
  const q = questions[idx];
  const distract = buildDistractors(pool, q, 3, x=>x.k);
  const opts = shuffleArr([q, ...distract]);

  let seqHtml = '';
  [...q.k].forEach(ch=>{
    // cari kana ini di seluruh chapter s.d chId
    let found = null;
    for(let i=1;i<=chId && !found;i++){ const c = CHAPTERS.find(x=>x.id===i); if(c) found = c.chars.find(x=>x.k===ch); }
    if(found) seqHtml += `<div class="cell-inline">${cellHTML(found.d,'black')}</div>`;
  });

  app.innerHTML = `
    <div class="screen-head">
      <button class="back-btn" id="quitBtn">✕</button>
      <div class="progress-bar"><div style="width:${Math.round((idx/questions.length)*100)}%"></div></div>
      <div class="hearts">${'❤️'.repeat(hearts)}${'🖤'.repeat(5-hearts)}</div>
    </div>
    <div class="screen quiz-wrap">
      <div class="quiz-prompt">${T('What word is this, and what does it mean?','この単語は何と読みますか。')}</div>
      <div class="quiz-focus"><div class="braille-seq">${seqHtml}</div></div>
      <div class="options" id="optsWrap">
        ${opts.map(o=> `<button class="opt-btn" data-correct="${o.k===q.k}"><span class="opt-main"><span class="opt-kana kana">${o.k}</span>${isJP()?'':`<span class="opt-romaji">${o.r}</span><span class="opt-mean hide">${o.e}</span>`}</span></button>`).join('')}
      </div>
      <button class="link-btn" style="margin-top:14px;" id="tableBtn">📖 ${T('Open the chart','一覧表を見る')} (−1 ❤️)</button>
    </div>
  `;
  document.getElementById('quitBtn').onclick = ()=> askConfirm(T('Leave the practice? Nothing is locked by this level.','練習をやめますか。このレベルで何かが閉ざされることはありません。'), renderHome);
  document.getElementById('tableBtn').onclick = ()=>{
    if(hearts<=1){ 
      hearts = 0; saveState();
      closeModal();
      return latihanResult(chId, correctCount, idx, false);
    }
    hearts -= 1;
    const hEl = document.querySelector('.hearts');
    if(hEl) hEl.innerHTML = '❤️'.repeat(hearts) + '🖤'.repeat(5-hearts);
    showTableModal(learnedCharsUpTo(chId), 'black');
  };
  document.querySelectorAll('#optsWrap .opt-btn').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('#optsWrap .opt-btn').forEach(b=>b.disabled=true);
      document.querySelectorAll('.opt-mean').forEach(e=>e.classList.remove('hide'));
      const ok = btn.dataset.correct==='true';
      let newHearts = hearts;
      btn.classList.add(ok?'correct':'wrong');
      if(!ok){
        newHearts -= 1;
        document.querySelectorAll('#optsWrap .opt-btn').forEach(b=>{ if(b.dataset.correct==='true') b.classList.add('correct'); });
      }
      const fb = document.createElement('div');
      fb.className = 'feedback-bar ' + (ok?'ok':'bad');
      const answerDetail = isJP()
        ? `<div style="font-size:13px;margin-bottom:10px;">${T('Correct answer:','正解：')} <b class="kana">${q.k}</b></div>`
        : `<div style="font-size:13px;margin-bottom:10px;">${T('Correct answer:','正解：')} <b>${q.r}</b> — <i>${q.e}</i></div>`;
      fb.innerHTML = `<div class="fb-title">${ok? T('✓ Correct!','✓ 正解！') : T('✕ Not quite (−1 ❤️)','✕ 残念（−1 ❤️）')}</div>
        ${ok?'': answerDetail}
        <button class="btn ${ok?'btn-primary':'btn-secondary'}" id="nextBtn">${T('Continue','次へ')}</button>`;
      document.querySelector('.quiz-wrap').appendChild(fb);
      fb.scrollIntoView({behavior:'smooth', block:'end'});
      document.getElementById('nextBtn').onclick = ()=> runLatihanQuestion(chId, questions, idx+1, newHearts, correctCount+(ok?1:0), pool);
    };
  });
}

}

/* ============================================================
   EXAM (straight to the quiz, no material or chart, covering every
   character learned up to the given chapter)
   ============================================================ */
function startExam(exam){
  const pool = CHAPTERS.filter(c=>c.id<=exam.afterChapter).flatMap(c=>c.chars);
  const total = Math.min(12, Math.max(8, pool.length));
  const questions = [];
  const shuffled = shuffleArr([...pool]);
  for(let i=0;i<total;i++){
    const ch = shuffled[i % shuffled.length];
    questions.push({type: Math.random()<0.5?'read':'match', ch});
  }
  runExamQuestion(exam, questions, 0, 0, pool);
}

function runExamQuestion(exam, questions, idx, correctCount, pool){
  if(idx >= questions.length){ return examResult(exam, correctCount, questions.length); }
  const q = questions[idx];
  const distract = buildDistractors(pool, q.ch, 3, x=>x.k);
  const opts = shuffleArr([q.ch, ...distract]);
  let bodyHtml = '';
  let optionsHtml = '';

  if(q.type==='read'){
    bodyHtml = `<div class="quiz-prompt">${T('What does this braille say?','この点字は何と読みますか。')}</div>
      <div class="quiz-focus"><div class="braille-seq">${cellHTML(q.ch.d,'black','big')}</div></div>`;
    opts.forEach(o=>{
      const label = `<span class="opt-main"><span class="opt-kana kana">${o.k}</span>${isJP()?'':`<span class="opt-romaji">${o.r}</span>`}</span>`;
      optionsHtml += `<button class="opt-btn" data-correct="${o.k===q.ch.k}">${label}</button>`;
    });
  } else {
    bodyHtml = `<div class="quiz-prompt">${T('Choose the correct dot pattern for:','正しい点の形を選んでください。')}</div>
      <div class="quiz-focus"><div class="big-kana kana">${q.ch.k}</div></div>`;
    opts.forEach(o=>{
      optionsHtml += `<button class="opt-btn" data-correct="${o.k===q.ch.k}">${cellHTML(o.d,'black')}</button>`;
    });
  }

  app.innerHTML = `
    <div class="screen-head">
      <button class="back-btn" id="quitBtn">✕</button>
      <div class="progress-bar"><div style="width:${Math.round((idx/questions.length)*100)}%; background:var(--purple);"></div></div>
      <div style="font-size:12px;font-weight:800;color:var(--ink-soft)">${idx+1}/${questions.length}</div>
    </div>
    <div class="screen quiz-wrap">
      ${bodyHtml}
      <div class="options">${optionsHtml}</div>
    </div>
  `;
  document.getElementById('quitBtn').onclick = ()=> askConfirm(T('Leave the exam? Your progress in it will be lost.','試験をやめますか。この試験の記録は消えます。'), renderHome);
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      const ok = btn.dataset.correct==='true';
      btn.classList.add(ok?'correct':'wrong');
      if(!ok){
        document.querySelectorAll('.opt-btn').forEach(b=>{ if(b.dataset.correct==='true') b.classList.add('correct'); });
      }
      const answerLabel = isJP() ? `<b class="kana">${q.ch.k}</b>` : `<b>${q.ch.r} (${q.ch.k})</b>`;
      const fb = document.createElement('div');
      fb.className = 'feedback-bar ' + (ok?'ok':'bad');
      fb.innerHTML = `<div class="fb-title">${ok? T('✓ Correct!','✓ 正解！') : T('✕ Not quite','✕ 残念')}</div>
        ${ok?'':`<div style="font-size:13px;margin-bottom:10px;">${T('Correct answer:','正解：')} ${answerLabel}</div>`}
        <button class="btn ${ok?'btn-primary':'btn-secondary'}" id="nextBtn" style="${ok?'':'background:var(--purple);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);'}">${T('Continue','次へ')}</button>`;
      document.querySelector('.quiz-wrap').appendChild(fb);
      fb.scrollIntoView({behavior:'smooth', block:'end'});
      document.getElementById('nextBtn').onclick = ()=> runExamQuestion(exam, questions, idx+1, correctCount+(ok?1:0), pool);
    };
  });
}

function examResult(exam, correct, total){
  const pass = correct/total >= 0.7;
  if(pass){ state.examProgress[exam.id] = {passed:true, best: Math.max((state.examProgress[exam.id]&&state.examProgress[exam.id].best)||0, correct)}; saveState(); }
  app.innerHTML = `
    <div class="screen center-screen">
      <div class="emoji">${pass?'🏆':'📜'}</div>
      <h2 class="${isJP()?'kana':''}">${pass? T(LX(exam.title)+' passed!', LX(exam.title)+' 合格！') : T('Not passed','不合格')}</h2>
      <p class="${isJP()?'kana':''}">${pass? T('Well done. You have the characters up to this point under control and can move on to the next chapter.','よくできました。ここまでの文字をしっかり覚えています。次の章へ進めます。') : T('You need at least 70% to pass. Review the earlier chapters and take the exam again.','合格には70％以上必要です。前の章を復習してからもう一度受けましょう。')}</p>
      <div class="result-stats">
        <div class="result-stat"><div class="n">${correct}/${total}</div><div class="l">${T('Correct','正解')}</div></div>
        <div class="result-stat"><div class="n">${Math.round(correct/total*100)}%</div><div class="l">${T('Accuracy','正答率')}</div></div>
      </div>
      <button class="btn" style="max-width:280px; background:var(--purple); color:#fff;" id="doneBtn">${pass? T('Back to map','マップに戻る') : T('Try again','もう一度')}</button>
    </div>
  `;
  document.getElementById('doneBtn').onclick = pass ? renderHome : ()=>startExam(exam);
}

renderHome();
</script>
</body>
</html>
